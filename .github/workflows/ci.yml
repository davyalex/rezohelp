name: CI

on:
  push:
    branches: [main]
    tags: ['lot-*']
  pull_request:

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rezohelp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rezohelp_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, pdo_mysql, bcmath, zip, exif, memcached, sockets
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Dépendances JS et build
        run: |
          npm ci
          npm run build

      - name: Budget JS public (< 50 Ko gzip, sans bibliothèque du back-office)
        run: npm run budget-js

      - name: Navigateur des tests de bout en bout (Playwright, Chromium)
        run: npx playwright install --with-deps chromium

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan (niveau 6)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest, parallèle)
        run: php artisan test --parallel

      - name: Migrations et seeders sur base vide
        env:
          DB_DATABASE: rezohelp_test
          CACHE_STORE: array
        run: php artisan migrate:fresh --seed --force
